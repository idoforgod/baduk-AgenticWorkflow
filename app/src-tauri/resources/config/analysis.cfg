# =============================================================================
# KataGo Analysis Engine Configuration
# =============================================================================
# Version: 1.16.4 compatible
# Source: Step 2 IPC spec, Section 2.2 and KataGo analysis_example.cfg (S2)
#
# This config is used when spawning KataGo as a Tauri sidecar:
#   ./katago analysis -config analysis.cfg -model <model.bin.gz>
#
# IMPORTANT: The key settings that affect game quality and performance are
# documented below. Step 12 (katago-integrator) will tune these values based
# on hardware benchmark results.
# =============================================================================

# ---------------------------------------------------------------------------
# GPU Backend Configuration
# ---------------------------------------------------------------------------
# GPU backend is auto-detected by the katago_detect_backend command.
# These defaults work with any backend.

# Enable FP16 for supported GPUs (Metal, CUDA, OpenCL)
# Set to "auto" to let KataGo decide based on GPU capabilities
# fp16 = auto

# ---------------------------------------------------------------------------
# Analysis Threads
# ---------------------------------------------------------------------------
# Number of positions to analyze in parallel.
# For 9x9 Quick Go games, 1-2 threads is optimal (each game is sequential).
# For post-game batch analysis, increase to 4-8.
# Override via command line: --analysis-threads N
numAnalysisThreads = 1
numSearchThreads = 2

# ---------------------------------------------------------------------------
# Neural Network Batch Size
# ---------------------------------------------------------------------------
# Maximum number of neural network evaluations per batch.
# Larger = more GPU utilization, higher latency.
# For interactive play: 32 or lower for low latency.
# For batch analysis: 128-256 for throughput.
nnMaxBatchSize = 32

# ---------------------------------------------------------------------------
# Analysis PV Length
# ---------------------------------------------------------------------------
# Maximum principal variation length reported per move candidate.
# 10 is sufficient for explanation generation (Step 4 templates).
analysisPVLen = 10

# ---------------------------------------------------------------------------
# Report During Search
# ---------------------------------------------------------------------------
# Disable intermediate results for the scaffold.
# Step 12 enables this for progressive analysis UI updates.
# reportDuringSearchEvery = 1.0

# ---------------------------------------------------------------------------
# Cache Size
# ---------------------------------------------------------------------------
# Neural network result cache in MB.
# Larger cache = better performance for repeated positions (e.g., fuseki patterns).
nnCacheSizePowerOfTwo = 17

# ---------------------------------------------------------------------------
# Search Tree Settings
# ---------------------------------------------------------------------------
# These are overridden per-query by the difficulty system (Step 12).
# maxVisits in the query overrides this config value.
# Default visits for normal analysis (not gameplay).
maxVisits = 100

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# KataGo writes startup messages and errors to stderr.
# The Tauri sidecar command handler consumes stderr to prevent pipe blocking.
logSearchInfo = false
logToStderr = true
