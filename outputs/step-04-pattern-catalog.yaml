# =============================================================================
# Template Explanation Engine: Pattern Catalog
# =============================================================================
# Version: 1.0.0
# Author: @template-designer (Step 4)
# Date: 2026-03-11
# Consumer: Step 13 (template-engineer)
# Companion: outputs/step-04-template-engine-design.md
# Total Patterns: 90 (30 per tier)
#
# Pattern ID Convention: P-T{tier}-{category}-{number}
#   Tier:     1=Beginner, 2=Intermediate, 3=Advanced
#   Category: MQ=Move Quality, PA=Position Assessment, OP=Opening,
#             MG=Middle Game, EG=Endgame, LD=Life/Death,
#             KO=Ko, SK=Seki, AL=Alternative, GN=Generic
#
# Core Invariant: LLM = Translator, KataGo = Truth Source
#   - Every {placeholder} maps to a KataGo field or computed value
#   - Patterns marked mandatory: true bypass LLM entirely
#   - Empty slots are compilation errors
# =============================================================================

metadata:
  version: "1.0.0"
  author: "@template-designer"
  date: "2026-03-11"
  total_patterns: 90
  patterns_per_tier:
    beginner: 30
    intermediate: 30
    advanced: 30
  categories:
    - move_quality       # 7 per tier
    - position_assessment # 4 per tier
    - opening            # 3 per tier
    - middle_game        # 3 per tier
    - endgame            # 3 per tier
    - life_death         # 3 per tier (MANDATORY)
    - ko                 # 2 per tier (MANDATORY)
    - seki               # 1 per tier (MANDATORY)
    - alternative        # 2 per tier
    - generic            # 2 per tier

# =============================================================================
# Threshold Definitions (referenced by trigger conditions)
# =============================================================================

thresholds:
  BLUNDER_WINRATE_DROP: -0.10
  MISTAKE_WINRATE_DROP: -0.05
  INACCURACY_WINRATE_DROP: -0.02
  EXCELLENT_TOP_GAP: 0.03
  BRILLIANT_PRIOR_CEILING: 0.05
  BRILLIANT_MIN_VISITS: 100
  CLOSE_GAME_RANGE: [0.45, 0.55]
  SLIGHT_ADVANTAGE_RANGE: [0.55, 0.65]
  STRONG_ADVANTAGE_THRESHOLD: 0.65
  DECISIVE_THRESHOLD: 0.85
  LOSING_THRESHOLD: 0.35
  SCORE_SIGNIFICANT_DELTA: 2.0
  HIGH_CONFIDENCE_VISITS: 400
  LOW_CONFIDENCE_VISITS: 50
  LIFE_DEATH_OWNERSHIP_ALIVE: 0.7
  LIFE_DEATH_OWNERSHIP_DEAD: -0.7
  LIFE_DEATH_OWNERSHIP_UNSETTLED: [-0.4, 0.4]
  CONTESTED_OWNERSHIP: 0.3
  KO_STAKES_LARGE: 5.0
  OPENING_19x19: 40
  OPENING_13x13: 25
  OPENING_9x9: 15

# =============================================================================
# Computed Field Definitions
# =============================================================================

computed_fields:
  - name: "winrateDelta"
    formula: "current.rootInfo.winrate - previous.rootInfo.winrate (adjusted for perspective)"
    requires: "previous analysis"
    description: "Change in winrate between consecutive moves"

  - name: "scoreLeadDelta"
    formula: "current.rootInfo.scoreLead - previous.rootInfo.scoreLead (adjusted for perspective)"
    requires: "previous analysis"
    description: "Change in score lead between consecutive moves"

  - name: "bestMovePlayed"
    formula: "actualMove === moveInfos[0].move"
    requires: "actual move known"
    description: "Whether the player played KataGo's top choice"

  - name: "moveRank"
    formula: "index of actualMove in moveInfos sorted by order"
    requires: "actual move known"
    description: "How KataGo ranks the played move"

  - name: "topMoveGap"
    formula: "moveInfos[0].winrate - moveInfos[1].winrate"
    requires: "at least 2 candidates"
    description: "Winrate gap between best and second-best move"

  - name: "winrate_pct"
    formula: "rootInfo.winrate * 100"
    description: "Winrate as percentage"

  - name: "best_winrate_pct"
    formula: "moveInfos[0].winrate * 100"
    description: "Best move winrate as percentage"

  - name: "winrate_delta_pct"
    formula: "abs(winrateDelta) * 100"
    description: "Absolute winrate change as percentage"

  - name: "pv_formatted"
    formula: "moveInfos[0].pv.join(' -> ')"
    description: "Principal variation as arrow-separated string"

  - name: "pv_short"
    formula: "moveInfos[0].pv.slice(0, 2).join(' -> ')"
    description: "First 2 moves of PV"

  - name: "pv_medium"
    formula: "moveInfos[0].pv.slice(0, 3).join(' -> ')"
    description: "First 3 moves of PV"

  - name: "pv_long"
    formula: "moveInfos[0].pv.slice(0, 5).join(' -> ')"
    description: "First 5 moves of PV"

  - name: "ko_value"
    formula: "abs(moveInfos[0].scoreLead - moveInfos[1].scoreLead)"
    requires: "ko detection triggered"
    description: "Estimated point value of the ko fight"

  - name: "confidence_label"
    formula: "visits >= 400 ? 'high' : visits >= 100 ? 'moderate' : 'low'"
    description: "Human-readable confidence label"

  - name: "prior_pct"
    formula: "moveInfos[i].prior * 100"
    description: "Neural network policy prior as percentage"

  - name: "lcb_pct"
    formula: "moveInfos[i].lcb * 100"
    description: "Lower confidence bound as percentage"

# =============================================================================
# BEGINNER TIER (T1) — 30 Patterns
# =============================================================================
# Language: No Go terms. Simple sentences. Encouraging tone.
# Number format: Whole numbers only.
# PV display: First 2 moves.
# Max sentences: 3.
# =============================================================================

patterns:

  # ---------------------------------------------------------------------------
  # T1: MOVE QUALITY (7 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-MQ-01"
    name: "Blunder"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: true
      conditions:
        - field: "winrateDelta"
          operator: "<"
          value: -0.10
    template:
      text: "Careful! This move gave away a big lead. Your winning chance dropped by {winrate_delta_pct}%. A better spot would have been {best_move}."
      slots:
        winrate_delta_pct:
          source: "computed.winrate_delta_pct"
          format: "integer"
        best_move:
          source: "moveInfos[0].move"
          format: "string"

  - id: "P-T1-MQ-02"
    name: "Mistake"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: true
      conditions:
        - field: "winrateDelta"
          operator: "<"
          value: -0.05
        - field: "winrateDelta"
          operator: ">="
          value: -0.10
    template:
      text: "This move was not the best choice. Your winning chance went down by {winrate_delta_pct}%. Next time, try looking at {best_move} instead."
      slots:
        winrate_delta_pct:
          source: "computed.winrate_delta_pct"
          format: "integer"
        best_move:
          source: "moveInfos[0].move"
          format: "string"

  - id: "P-T1-MQ-03"
    name: "Inaccuracy"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: true
      conditions:
        - field: "winrateDelta"
          operator: "<"
          value: -0.02
        - field: "winrateDelta"
          operator: ">="
          value: -0.05
    template:
      text: "This move was okay, but there was a slightly better option at {best_move}. Your chances changed by just {winrate_delta_pct}%, so no big deal."
      slots:
        winrate_delta_pct:
          source: "computed.winrate_delta_pct"
          format: "integer"
        best_move:
          source: "moveInfos[0].move"
          format: "string"

  - id: "P-T1-MQ-04"
    name: "Brilliant Move"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "moveRank"
          operator: "=="
          value: 0
        - field: "moveInfos[0].prior"
          operator: "<"
          value: 0.05
        - field: "moveInfos[0].visits"
          operator: ">"
          value: 100
    template:
      text: "Wow, great find! This move was hard to spot, but it turns out to be the best choice. Even the computer did not expect it at first."
      slots: {}

  - id: "P-T1-MQ-05"
    name: "Excellent Move"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "moveRank"
          operator: "=="
          value: 0
        - field: "topMoveGap"
          operator: ">"
          value: 0.03
    template:
      text: "Excellent move! This was clearly the best option and puts you in a strong position. You are now ahead by about {score_lead} points."
      slots:
        score_lead:
          source: "rootInfo.scoreLead"
          format: "integer"

  - id: "P-T1-MQ-06"
    name: "Good Move"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "moveRank"
          operator: "=="
          value: 0
    template:
      text: "Nice choice! This is the computer's top pick too. Your winning chance is {winrate_pct}%."
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  - id: "P-T1-MQ-07"
    name: "Acceptable Move"
    tier: "beginner"
    category: "move_quality"
    mandatory: false
    trigger:
      requires_delta: true
      conditions:
        - field: "moveRank"
          operator: "in"
          value: [1, 2]
        - field: "winrateDelta"
          operator: ">="
          value: -0.02
    template:
      text: "Solid move. It was not the computer's top choice, but it is very close. You are doing fine here."
      slots: {}

  # ---------------------------------------------------------------------------
  # T1: POSITION ASSESSMENT (4 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-PA-01"
    name: "Decisive Advantage"
    tier: "beginner"
    category: "position_assessment"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "rootInfo.winrate"
          operator: ">"
          value: 0.85
    template:
      text: "You are in a very strong position! The computer gives you a {winrate_pct}% chance of winning. Keep playing carefully and the game is yours."
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  - id: "P-T1-PA-02"
    name: "Strong Advantage"
    tier: "beginner"
    category: "position_assessment"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "rootInfo.winrate"
          operator: ">"
          value: 0.65
        - field: "rootInfo.winrate"
          operator: "<="
          value: 0.85
    template:
      text: "Things are looking good for you. You have a {winrate_pct}% winning chance and lead by about {score_lead} points."
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"
        score_lead:
          source: "rootInfo.scoreLead"
          format: "integer"

  - id: "P-T1-PA-03"
    name: "Even Position"
    tier: "beginner"
    category: "position_assessment"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "rootInfo.winrate"
          operator: ">="
          value: 0.45
        - field: "rootInfo.winrate"
          operator: "<="
          value: 0.55
    template:
      text: "The game is very close right now. Both players have a roughly equal chance of winning. Every move counts!"
      slots: {}

  - id: "P-T1-PA-04"
    name: "Significant Disadvantage"
    tier: "beginner"
    category: "position_assessment"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "rootInfo.winrate"
          operator: "<"
          value: 0.35
    template:
      text: "You are behind right now. The computer gives you a {winrate_pct}% chance. But do not give up — comebacks happen!"
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  # ---------------------------------------------------------------------------
  # T1: OPENING (3 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-OP-01"
    name: "Opening Strong Move"
    tier: "beginner"
    category: "opening"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "opening"
        - field: "moveRank"
          operator: "=="
          value: 0
    template:
      text: "Good start! In the opening, it is important to claim the corners and sides. This move does that well."
      slots: {}

  - id: "P-T1-OP-02"
    name: "Opening Suboptimal Move"
    tier: "beginner"
    category: "opening"
    mandatory: false
    trigger:
      requires_delta: true
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "opening"
        - field: "winrateDelta"
          operator: "<"
          value: -0.02
    template:
      text: "In the early game, try to play near the corners and edges first. The computer suggests {best_move} as a better opening move."
      slots:
        best_move:
          source: "moveInfos[0].move"
          format: "string"

  - id: "P-T1-OP-03"
    name: "Opening Neutral"
    tier: "beginner"
    category: "opening"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "opening"
    template:
      text: "The game is just getting started. Both players are setting up their positions. Your winning chance is {winrate_pct}%."
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  # ---------------------------------------------------------------------------
  # T1: MIDDLE GAME (3 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-MG-01"
    name: "Middle Game Advantage"
    tier: "beginner"
    category: "middle_game"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "middle_game"
        - field: "rootInfo.winrate"
          operator: ">"
          value: 0.55
    template:
      text: "You are doing well in the middle of the game. You lead by about {score_lead} points. Try to keep your groups connected and safe."
      slots:
        score_lead:
          source: "rootInfo.scoreLead"
          format: "integer"

  - id: "P-T1-MG-02"
    name: "Middle Game Disadvantage"
    tier: "beginner"
    category: "middle_game"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "middle_game"
        - field: "rootInfo.winrate"
          operator: "<"
          value: 0.45
    template:
      text: "The middle of the game is tricky. You are a bit behind right now. Look for chances to surround more area or put pressure on your opponent's groups."
      slots: {}

  - id: "P-T1-MG-03"
    name: "Middle Game Close"
    tier: "beginner"
    category: "middle_game"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "middle_game"
    template:
      text: "The game is close in the middle phase. Both players have chances. Your winning chance is {winrate_pct}%."
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  # ---------------------------------------------------------------------------
  # T1: ENDGAME (3 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-EG-01"
    name: "Endgame Winning"
    tier: "beginner"
    category: "endgame"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "endgame"
        - field: "rootInfo.winrate"
          operator: ">"
          value: 0.55
    template:
      text: "You are ahead near the end of the game! You lead by about {score_lead} points. Focus on securing the borders of your territory."
      slots:
        score_lead:
          source: "rootInfo.scoreLead"
          format: "integer"

  - id: "P-T1-EG-02"
    name: "Endgame Losing"
    tier: "beginner"
    category: "endgame"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "endgame"
        - field: "rootInfo.winrate"
          operator: "<"
          value: 0.45
    template:
      text: "You are behind near the end of the game. The computer sees your opponent ahead by about {score_lead_abs} points. Look for any remaining big moves."
      slots:
        score_lead_abs:
          source: "abs(rootInfo.scoreLead)"
          format: "integer"

  - id: "P-T1-EG-03"
    name: "Endgame Close"
    tier: "beginner"
    category: "endgame"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "movePhase"
          operator: "=="
          value: "endgame"
    template:
      text: "The game is very close near the end! Every point matters. Your winning chance is {winrate_pct}%."
      slots:
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  # ---------------------------------------------------------------------------
  # T1: LIFE/DEATH — MANDATORY (3 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-LD-01"
    name: "Group Alive"
    tier: "beginner"
    category: "life_death"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "life_death"
        - field: "group_ownership"
          operator: ">"
          value: 0.7
    template:
      text: "This group of stones is safe. It has enough room to survive. You do not need to worry about it right now."
      slots: {}
    fallback_id: "P-T1-LD-01-fb"

  - id: "P-T1-LD-01-fb"
    name: "Group Alive (no ownership)"
    tier: "beginner"
    category: "life_death"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "life_death"
        - field: "rootInfo.scoreLead"
          operator: ">"
          value: 3.0
    template:
      text: "The computer thinks this group is safe. You have a good position here."
      slots: {}

  - id: "P-T1-LD-02"
    name: "Group Dead"
    tier: "beginner"
    category: "life_death"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "life_death"
        - field: "group_ownership"
          operator: "<"
          value: -0.7
    template:
      text: "This group of stones is in danger. The computer thinks it will be captured. Try to avoid this situation in the future."
      slots: {}
    fallback_id: "P-T1-LD-02-fb"

  - id: "P-T1-LD-02-fb"
    name: "Group Dead (no ownership)"
    tier: "beginner"
    category: "life_death"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "life_death"
        - field: "rootInfo.scoreLead"
          operator: "<"
          value: -5.0
    template:
      text: "The computer thinks this group might not survive. It is important to protect your groups."
      slots: {}

  - id: "P-T1-LD-03"
    name: "Group Unsettled"
    tier: "beginner"
    category: "life_death"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "life_death"
        - field: "group_ownership"
          operator: "between"
          value: [-0.4, 0.4]
    template:
      text: "This group's fate is not decided yet. The next few moves will determine if it survives. The best move here is {best_move}."
      slots:
        best_move:
          source: "moveInfos[0].move"
          format: "string"
    fallback_id: "P-T1-LD-03-fb"

  - id: "P-T1-LD-03-fb"
    name: "Group Unsettled (no ownership)"
    tier: "beginner"
    category: "life_death"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "life_death"
    template:
      text: "There is a fight for survival happening here. The computer suggests playing at {best_move}."
      slots:
        best_move:
          source: "moveInfos[0].move"
          format: "string"

  # ---------------------------------------------------------------------------
  # T1: KO — MANDATORY (2 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-KO-01"
    name: "Ko Fight Large"
    tier: "beginner"
    category: "ko"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "ko"
        - field: "ko_value"
          operator: ">"
          value: 5.0
    template:
      text: "A special kind of fight called a 'ko' is happening here. Both players take turns trying to win this area. It is worth about {ko_value} points, so it is very important!"
      slots:
        ko_value:
          source: "computed.ko_value"
          format: "integer"

  - id: "P-T1-KO-02"
    name: "Ko Fight Small"
    tier: "beginner"
    category: "ko"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "ko"
    template:
      text: "There is a small back-and-forth fight here called a 'ko'. It is worth about {ko_value} points."
      slots:
        ko_value:
          source: "computed.ko_value"
          format: "integer"

  # ---------------------------------------------------------------------------
  # T1: SEKI — MANDATORY (1 pattern)
  # ---------------------------------------------------------------------------

  - id: "P-T1-SK-01"
    name: "Seki Detected"
    tier: "beginner"
    category: "seki"
    mandatory: true
    trigger:
      requires_delta: false
      conditions:
        - field: "category"
          operator: "=="
          value: "seki"
    template:
      text: "Both groups of stones here are alive. Neither player can capture the other without losing their own stones. They will both stay on the board."
      slots: {}

  # ---------------------------------------------------------------------------
  # T1: ALTERNATIVE MOVES (2 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-AL-01"
    name: "Better Alternative Available"
    tier: "beginner"
    category: "alternative"
    mandatory: false
    trigger:
      requires_delta: true
      conditions:
        - field: "moveRank"
          operator: ">"
          value: 0
        - field: "winrateDelta"
          operator: "<"
          value: -0.02
    template:
      text: "The computer's top choice was {best_move}. If you played there, your winning chance would be {best_winrate_pct}% instead of {winrate_pct}%."
      slots:
        best_move:
          source: "moveInfos[0].move"
          format: "string"
        best_winrate_pct:
          source: "computed.best_winrate_pct"
          format: "integer"
        winrate_pct:
          source: "computed.winrate_pct"
          format: "integer"

  - id: "P-T1-AL-02"
    name: "Multiple Good Options"
    tier: "beginner"
    category: "alternative"
    mandatory: false
    trigger:
      requires_delta: false
      conditions:
        - field: "topMoveGap"
          operator: "<"
          value: 0.02
    template:
      text: "There are several good choices here. The computer likes {best_move} and {second_move} almost equally. You cannot go wrong with either!"
      slots:
        best_move:
          source: "moveInfos[0].move"
          format: "string"
        second_move:
          source: "moveInfos[1].move"
          format: "string"

  # ---------------------------------------------------------------------------
  # T1: GENERIC / CONFIDENCE (2 patterns)
  # ---------------------------------------------------------------------------

  - id: "P-T1-GN-01"
    name: "Position Summary"
    tier: "beginner"
    category: "generic"
    mandatory: false
    trigger:
      requires_delta: false
      conditions: []
    template:
      text: "The computer's best suggestion is {best_move}. Your current winning chance is {winrate_pct}%."
      slots:
        best_move:
          source: "moveInfos[0].move"
